name: design_system
description: A clean, professional design system package with colors, typography, and UI components
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ">=3.7.0 <4.0.0"


dependencies:
  flutter:
    sdk: flutter
  go_router: ^17.0.0
  flutter_form_builder: ^10.0.1
  intl_phone_number_input: ^0.7.4
  pinput: ^5.0.0
  flutter_svg: ^2.0.10+1
  country_pickers: ^3.0.1
  phone_numbers_parser: ^8.3.0
  # md_design_system:
  # kyc:
  flutter_bloc: ^9.1.1
  bloc: ^9.1.0
  confetti: ^0.8.0
  scrollable_list_tab_scroller: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_gen: ^5.0.1
  flutter_gen_runner: ^5.12.0
  build_runner: ^2.10.4

flutter_gen:
  output: lib/gen/
  line_length: 80
  assets:
    enabled: true
    outputs:
      class_name: Assets
      package_parameter_enabled: true

flutter:
  uses-material-design: true

  # Asset configuration for icons
  assets:
    - assets/icons/
    - assets/images/

  # Font configuration
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Montserrat/Montserrat-Light.ttf  
          weight: 300
        - asset: assets/fonts/Montserrat/Montserrat-Regular.ttf    
          weight: 400
        - asset: assets/fonts/Montserrat/Montserrat-SemiBold.ttf
          weight: 500
        - asset: assets/fonts/Montserrat/Montserrat-Bold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat/Montserrat-ExtraBold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat/Montserrat-Black.ttf
          weight: 800

    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto/Roboto_Condensed-ExtraLight.ttf    
          weight: 200
        - asset: assets/fonts/Roboto/Roboto_Condensed-Light.ttf  
          weight: 300
        - asset: assets/fonts/Roboto/Roboto_Condensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto_Condensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto_Condensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Roboto/Roboto_Condensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto/Roboto_Condensed-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Roboto/Roboto_Condensed-Black.ttf
          weight: 900

    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSens/DMSans-ExtraLight.ttf      
          weight: 200
        - asset: assets/fonts/DMSens/DMSans-Light.ttf  
          weight: 300
        - asset: assets/fonts/DMSens/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSens/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSens/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSens/DMSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/DMSens/DMSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/DMSens/DMSans-Black.ttf
          weight: 900

    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend/Lexend-ExtraLight.ttf      
          weight: 200
        - asset: assets/fonts/Lexend/Lexend-Light.ttf  
          weight: 300
        - asset: assets/fonts/Lexend/Lexend-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lexend/Lexend-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lexend/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend/Lexend-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lexend/Lexend-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Lexend/Lexend-Black.ttf
          weight: 900          

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-ExtraLight.ttf   
          weight: 200
        - asset: assets/fonts/Poppins/Poppins-Light.ttf  
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
