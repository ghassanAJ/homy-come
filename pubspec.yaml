name: my_workspace
publish_to: none
environment:
  sdk: ^3.9.0
workspace:
  - packages/design_system
  - packages/utility/api_client
  - packages/utility/util
  - packages/features/authentication
  - packages/features/booking
  - packages/features/profile

  - apps/user
  - apps/driver
  - apps/provider

dev_dependencies:
  melos: ^7.0.0-dev.9


melos:
  scripts:
    build:runner:
      run: dart run build_runner build --delete-conflicting-outputs
      exec:
        concurrency: 1
        
  command:
    bootstrap:
      environment:
        sdk: ">=3.7.0 <4.0.0"

      dependencies:
        freezed_annotation: ^3.1.0
        json_annotation: ^4.9.0
        dio: ^5.9.0
        retrofit: ^4.9.1
        injectable: ^2.6.0
        get_it: ^9.1.0
        flutter_bloc: ^9.1.1
        bloc: ^9.1.0
        equatable: ^2.0.7
        go_router: ^17.0.0
        i69n: ^3.3.0

      dev_dependencies:
        build_runner: ^2.10.4
        json_serializable: ^6.11.2        
        retrofit_generator: ^10.2.0
        freezed: ^3.2.3
        injectable_generator: ^2.9.1
        flutter_lints: ^6.0.0